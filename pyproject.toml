[project]
name = "datamart-etl-airflow"
version = "0.1.0"
description = "DataMart S.A.S. ETL pipeline orchestrated with Apache Airflow 3 and a PostgreSQL data warehouse"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Pinned to the same versions as the apache/airflow:3.1.5 constraints (Python 3.12),
# so the code is tested locally with the same libraries the container uses.
dependencies = [
    "numpy==1.26.4",
    "pandas==2.1.4",
    "pyarrow==18.1.0",
    "sqlalchemy==1.4.54",
    "psycopg2-binary==2.9.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["include", "dags"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["datamart"]
